name: Release Maven Starter

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish Maven Starter to GitHub Packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Deploying Maven Starter version: ${VERSION}"
          mvn -B deploy -Drevision="${VERSION}" -f packages/sdui-spring-boot-starter/pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
